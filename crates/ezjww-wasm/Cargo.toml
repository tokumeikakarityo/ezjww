[package]
name = "ezjww-wasm"
version.workspace = true
edition = "2021"
description = "WebAssembly bindings for ezjww."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8.35"
ezjww-core = { path = "../ezjww-core" }
js-sys = "0.3"
serde = "1.0"
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
